name: .NET CI

on:
  push:
    branches:
      - DevBranch

  pull_request:
    branches:
      - DevBranch
      
permissions:
  id-token: write
  contents: read


jobs:
  build-and-test:
    
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore LoginWebApplication.slnx

      - name: Build
        run: dotnet build LoginWebApplication.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test LoginWebApplication.slnx --no-build --configuration Release
            
    
      - name: Azure Login
        uses: azure/login@v2
        with:
            client-id: ${{ secrets.AZURE_CLIENT_ID }}
            tenant-id: ${{ secrets.AZURE_TENANT_ID }}
            subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Log in to Azure Container Registry
        run: az acr login --name prajotloginwebacr

      - name: Build Docker image
        run: docker build -t prajotloginwebacr.azurecr.io/login-web-api:latest .${{ github.sha }} .

      - name: Push Docker image
        run: docker push prajotloginwebacr.azurecr.io/login-web-api:${{ github.sha }}

      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name login-web-api-container \
            --resource-group PrajotRG \
            --image prajotloginwebacr.azurecr.io/login-web-api:${{ github.sha }}

