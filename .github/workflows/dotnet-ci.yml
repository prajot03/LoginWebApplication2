name: .NET CI

on:
  push:
    branches:
      - DevBranch

  pull_request:
    branches:
      - DevBranch

jobs:
  build-and-test:
    
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore LoginWebApplication.slnx

      - name: Build
        run: dotnet build LoginWebApplication.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test LoginWebApplication.slnx --no-build --configuration Release
            
      - name: Build Docker image
        run: docker build -t login-web-api:latest .

